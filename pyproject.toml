[project]
name = "optical-propagation-sanity-check"
version = "0.1.0"
description = "Evidence-oriented sampling and validity checks for discrete optical propagation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.12",
    "waveprop>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
propagation-sanity = "propagation_sanity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propagation_sanity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

