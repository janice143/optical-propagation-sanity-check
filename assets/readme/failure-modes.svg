<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="fm-title fm-desc">
  <title id="fm-title">Five silent failure modes detected by the toolkit</title>
  <desc id="fm-desc">Five card grid summarizing the numerical failure modes this toolkit detects: chirp aliasing, circular convolution, domain truncation, paraxial misuse, and inverse-design overfitting.</desc>

  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101729"/>
      <stop offset="100%" stop-color="#0b1124"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2740"/>
      <stop offset="100%" stop-color="#0f162b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="22" fill="#0a0f1e"/>

  <!-- Eyebrow + title -->
  <g transform="translate(56 50)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="0" y="-12" width="11" height="11" rx="2" fill="#f87171"/>
    <text x="22" y="-2" font-size="13" fill="#8b95b1" letter-spacing="0.5">
      WHAT IT CATCHES
    </text>
  </g>
  <g transform="translate(56 90)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" font-size="34" font-weight="700" fill="#e4e8f1" letter-spacing="-0.5">
      Five silent failure modes — caught before you publish.
    </text>
  </g>

  <!-- Cards -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

    <!-- ===== Card 1: Chirp aliasing ===== -->
    <g transform="translate(56 150)">
      <rect x="0" y="0" width="200" height="200" rx="14" fill="url(#cardBg)" stroke="#1f2740"/>
      <!-- icon: chirp oscillation that breaks -->
      <g transform="translate(20 20)">
        <path d="M 0 30 L 8 8 L 16 52 L 24 -10 L 32 60 L 40 4 L 48 50 L 56 12 L 64 48 L 72 18 L 80 44"
              fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="0" y1="60" x2="160" y2="60" stroke="#1f2740" stroke-width="1"/>
        <text x="0" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="10" fill="#5b6480">H(f) chirp</text>
      </g>
      <text x="20" y="148" font-size="17" font-weight="600" fill="#e4e8f1">Chirp aliasing</text>
      <g transform="translate(20 158)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b95b1">
        <text x="0" y="14">H(f) oscillates</text>
        <text x="0" y="31">past Nyquist.</text>
      </g>
    </g>

    <!-- ===== Card 2: Circular convolution ===== -->
    <g transform="translate(278 150)">
      <rect x="0" y="0" width="200" height="200" rx="14" fill="url(#cardBg)" stroke="#1f2740"/>
      <!-- icon: ring with arrow wrapping around -->
      <g transform="translate(20 20)">
        <circle cx="36" cy="30" r="20" fill="none" stroke="#22d3ee" stroke-width="2"/>
        <path d="M 56 30 A 20 20 0 0 1 36 50" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 30 46 L 36 50 L 40 44" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="14" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="10" fill="#5b6480">periodic wrap</text>
      </g>
      <text x="20" y="148" font-size="17" font-weight="600" fill="#e4e8f1">Circular convolution</text>
      <g transform="translate(20 158)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b95b1">
        <text x="0" y="14">FFT assumes</text>
        <text x="0" y="31">periodic edges.</text>
      </g>
    </g>

    <!-- ===== Card 3: Domain truncation ===== -->
    <g transform="translate(500 150)">
      <rect x="0" y="0" width="200" height="200" rx="14" fill="url(#cardBg)" stroke="#1f2740"/>
      <!-- icon: a square pulse fading as it crosses the edge -->
      <g transform="translate(20 20)">
        <rect x="0" y="20" width="120" height="20" fill="#a78bfa" opacity="0.9"/>
        <rect x="120" y="20" width="40" height="20" fill="#a78bfa" opacity="0.4"/>
        <path d="M 120 20 L 130 40 L 120 40 Z" fill="#0a0f1e"/>
        <text x="148" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="10" fill="#a78bfa">?</text>
        <line x1="0" y1="60" x2="160" y2="60" stroke="#1f2740" stroke-width="1"/>
        <text x="0" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="10" fill="#5b6480">truncated at L</text>
      </g>
      <text x="20" y="148" font-size="17" font-weight="600" fill="#e4e8f1">Domain truncation</text>
      <g transform="translate(20 158)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b95b1">
        <text x="0" y="14">Energy leaves</text>
        <text x="0" y="31">the window.</text>
      </g>
    </g>

    <!-- ===== Card 4: Paraxial misuse ===== -->
    <g transform="translate(722 150)">
      <rect x="0" y="0" width="200" height="200" rx="14" fill="url(#cardBg)" stroke="#1f2740"/>
      <!-- icon: two cones - paraxial (correct) vs divergent (wrong) -->
      <g transform="translate(20 20)">
        <line x1="40" y1="0" x2="40" y2="60" stroke="#34d399" stroke-width="1.5"/>
        <path d="M 40 0 L 28 60 M 40 0 L 52 60" stroke="#34d399" stroke-width="1.5" fill="none" opacity="0.6"/>
        <line x1="120" y1="0" x2="120" y2="60" stroke="#fbbf24" stroke-width="1.5"/>
        <path d="M 120 0 L 88 60 M 120 0 L 152 60" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
        <text x="20" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="10" fill="#5b6480">Fresnel vs exact</text>
      </g>
      <text x="20" y="148" font-size="17" font-weight="600" fill="#e4e8f1">Paraxial misuse</text>
      <g transform="translate(20 158)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b95b1">
        <text x="0" y="14">Fresnel used past</text>
        <text x="0" y="31">its validity.</text>
      </g>
    </g>

    <!-- ===== Card 5: Numerical overfitting ===== -->
    <g transform="translate(944 150)">
      <rect x="0" y="0" width="200" height="200" rx="14" fill="url(#cardBg)" stroke="#1f2740"/>
      <!-- icon: descending training loss curve vs validation loss -->
      <g transform="translate(20 20)">
        <path d="M 0 10 Q 30 8 60 14 T 120 24 T 160 30"
              fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
        <path d="M 0 30 Q 40 50 80 56 T 160 60"
              fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
        <line x1="0" y1="62" x2="160" y2="62" stroke="#1f2740" stroke-width="1"/>
        <text x="0" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="10" fill="#5b6480">train vs eval</text>
      </g>
      <text x="20" y="148" font-size="17" font-weight="600" fill="#e4e8f1">Numerical overfitting</text>
      <g transform="translate(20 158)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b95b1">
        <text x="0" y="14">Optimizers exploit</text>
        <text x="0" y="31">unbandlimited chirp.</text>
      </g>
    </g>

  </g>
</svg>
