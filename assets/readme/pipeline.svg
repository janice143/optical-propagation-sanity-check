<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="pl-title pl-desc">
  <title id="pl-title">Validation pipeline</title>
  <desc id="pl-desc">Four-stage pipeline: SimulationContract input, validate() with checks, ValidationReport, viewer.</desc>

  <defs>
    <linearGradient id="cardBg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101729"/>
      <stop offset="100%" stop-color="#0b1124"/>
    </linearGradient>
    <linearGradient id="step1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1a2e"/>
      <stop offset="100%" stop-color="#0a1224"/>
    </linearGradient>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="22" fill="#0a0f1e"/>

  <!-- Eyebrow + title -->
  <g transform="translate(56 50)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="0" y="-12" width="11" height="11" rx="2" fill="#22d3ee"/>
    <text x="22" y="-2" font-size="13" fill="#8b95b1" letter-spacing="0.5">
      HOW IT WORKS
    </text>
  </g>
  <g transform="translate(56 90)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" font-size="34" font-weight="700" fill="#e4e8f1" letter-spacing="-0.5">
      A four-stage evidence pipeline.
    </text>
  </g>

  <!-- ============ Stage 1: Contract ============ -->
  <g transform="translate(56 150)">
    <rect x="0" y="0" width="220" height="130" rx="14" fill="url(#cardBg2)" stroke="#1f2740"/>
    <!-- step number -->
    <g transform="translate(20 20)">
      <circle cx="10" cy="10" r="10" fill="#0a0f1e" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="10" y="14" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#22d3ee" font-weight="700">1</text>
      <text x="32" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#5b6480" letter-spacing="1">CONTRACT</text>
    </g>
    <!-- mini code block: contract -->
    <g transform="translate(20 50)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="0" y="14" fill="#8b95b1">
        <tspan fill="#22d3ee">Grid</tspan>(nx=512, dx=2e-6)
      </text>
      <text x="0" y="32" fill="#8b95b1">
        <tspan fill="#22d3ee">Wave</tspan>(λ=532 nm)
      </text>
      <text x="0" y="50" fill="#8b95b1">
        <tspan fill="#22d3ee">SimulationContract</tspan>(...)
      </text>
    </g>
  </g>

  <!-- arrow 1 -> 2 -->
  <g transform="translate(280 215)">
    <line x1="0" y1="0" x2="56" y2="0" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  </g>

  <!-- ============ Stage 2: validate() ============ -->
  <g transform="translate(342 150)">
    <rect x="0" y="0" width="220" height="130" rx="14" fill="url(#cardBg2)" stroke="#1f2740"/>
    <g transform="translate(20 20)">
      <circle cx="10" cy="10" r="10" fill="#0a0f1e" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="10" y="14" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#22d3ee" font-weight="700">2</text>
      <text x="32" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#5b6480" letter-spacing="1">VALIDATE</text>
    </g>
    <!-- check list -->
    <g transform="translate(20 50)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">
      <g fill="#8b95b1">
        <g transform="translate(0 4)">
          <rect x="0" y="2" width="6" height="6" rx="1" fill="#34d399"/>
          <text x="14" y="9">Sampling adequacy</text>
        </g>
        <g transform="translate(0 24)">
          <rect x="0" y="2" width="6" height="6" rx="1" fill="#34d399"/>
          <text x="14" y="9">BLAS bound (Matsushima)</text>
        </g>
        <g transform="translate(0 44)">
          <rect x="0" y="2" width="6" height="6" rx="1" fill="#22d3ee"/>
          <text x="14" y="9">Convergence: res · domain · pad</text>
        </g>
      </g>
    </g>
  </g>

  <!-- arrow 2 -> 3 -->
  <g transform="translate(566 215)">
    <line x1="0" y1="0" x2="56" y2="0" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  </g>

  <!-- ============ Stage 3: Report ============ -->
  <g transform="translate(628 150)">
    <rect x="0" y="0" width="220" height="130" rx="14" fill="url(#cardBg2)" stroke="#1f2740"/>
    <g transform="translate(20 20)">
      <circle cx="10" cy="10" r="10" fill="#0a0f1e" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="10" y="14" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#22d3ee" font-weight="700">3</text>
      <text x="32" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#5b6480" letter-spacing="1">REPORT</text>
    </g>
    <!-- terminal mini -->
    <g transform="translate(20 50)">
      <rect x="0" y="0" width="180" height="60" rx="6" fill="#0b1124" stroke="#1f2740"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
        <text x="8" y="14" fill="#5b6480">[ PASS ]    sampling</text>
        <text x="8" y="28" fill="#5b6480">[ PASS ]    BLAS bound</text>
        <text x="8" y="42" fill="#5b6480">[ FAIL ]    domain  &gt; L</text>
        <text x="8" y="56" fill="#5b6480">[ CONV ]    tol=1.0%</text>
      </g>
    </g>
  </g>

  <!-- arrow 3 -> 4 -->
  <g transform="translate(852 215)">
    <line x1="0" y1="0" x2="56" y2="0" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  </g>

  <!-- ============ Stage 4: View ============ -->
  <g transform="translate(914 150)">
    <rect x="0" y="0" width="230" height="130" rx="14" fill="url(#cardBg2)" stroke="#1f2740"/>
    <g transform="translate(20 20)">
      <circle cx="10" cy="10" r="10" fill="#0a0f1e" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="10" y="14" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#22d3ee" font-weight="700">4</text>
      <text x="32" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#5b6480" letter-spacing="1">VIEW</text>
    </g>
    <!-- mini dashboard mock -->
    <g transform="translate(20 50)">
      <rect x="0" y="0" width="190" height="60" rx="6" fill="#0b1124" stroke="#1f2740"/>
      <!-- header bar -->
      <rect x="0" y="0" width="190" height="14" rx="6" fill="#101729"/>
      <rect x="0" y="8" width="190" height="6" fill="#101729"/>
      <circle cx="8" cy="7" r="2" fill="#f87171" opacity="0.7"/>
      <circle cx="16" cy="7" r="2" fill="#fbbf24" opacity="0.7"/>
      <circle cx="24" cy="7" r="2" fill="#34d399" opacity="0.7"/>
      <text x="100" y="11" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="8" fill="#5b6480">dashboard.html</text>
      <!-- progress bars -->
      <rect x="10" y="22" width="170" height="4" rx="2" fill="#1f2740"/>
      <rect x="10" y="22" width="160" height="4" rx="2" fill="#34d399"/>
      <rect x="10" y="32" width="170" height="4" rx="2" fill="#1f2740"/>
      <rect x="10" y="32" width="120" height="4" rx="2" fill="#fbbf24"/>
      <rect x="10" y="42" width="170" height="4" rx="2" fill="#1f2740"/>
      <rect x="10" y="42" width="40" height="4" rx="2" fill="#f87171"/>
      <rect x="10" y="52" width="170" height="2" rx="1" fill="#1f2740"/>
    </g>
  </g>

  <!-- caption beneath -->
  <text x="600" y="304" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#5b6480">
    UNVERIFIED is not a pass — the report is explicit when stability has not been demonstrated.
  </text>
</svg>
